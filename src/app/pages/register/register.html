<div class="register-component">
    <mat-card>
        <mat-card-header>
            <mat-card-title>Cadastro de Usuário/Doces momentos</mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <mat-form-field class="full-width">
                <mat-label>Input</mat-label>
                <input matInput>
            </mat-form-field>

            <mat-form-field class="full-width">
                <mat-label>Select</mat-label>
                <mat-select>
                    <mat-option value="one">First option</mat-option>
                    <mat-option value="two">Second option</mat-option>
                </mat-select>
            </mat-form-field>
            <mat-form-field class="full-width">
                <mat-label>Textarea</mat-label>
                <textarea matInput></textarea>
            </mat-form-field>


        </mat-card-content>
        <mat-card-actions>
            <button matButton class="full-width">Cadastrar</button>
        </mat-card-actions>
    </mat-card>
</div>
