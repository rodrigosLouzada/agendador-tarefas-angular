<div class="register-component">
    <mat-card>

        <mat-card-header class="padding-m">
            <mat-card-title>Cadastro de Usuário/Doces momentos</mat-card-title>
        </mat-card-header>

        <form [formGroup]="form">

            <mat-card-content>
                <mat-form-field class="full-width" appearance="fill">
                    <mat-label>Nome Completo</mat-label>
                    <input matInput formControlName="fullName" placeholder="Digite o nome Completo aqui.">
                </mat-form-field>
            </mat-card-content>

            <mat-card-content>
                <mat-form-field class="full-width" appearance="fill">
                    <mat-label>Digite o seu email</mat-label>
                    <input matInput formControlName="email" placeholder="Digite o seu email aqui.">
                </mat-form-field>
            </mat-card-content>

            <mat-card-content>
                <input-password-field [control]="passwordControl"></input-password-field>
            </mat-card-content>

            <mat-card-actions>
                <button mat-raised-button color="primary" class="full-width" [disabled]="form.invalid" (click)="submit()">
                    Cadastrar
                </button>
            </mat-card-actions>

        </form>

    </mat-card>
</div>
