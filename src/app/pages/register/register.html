<div class="register-component">
    <mat-card>

        <mat-card-header class="padding-p">
            <mat-card-title>Cadastro de Usuário/Doces momentos</mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <mat-form-field class="full-width" appearance="outline">
                <mat-label>Nome Completo</mat-label>
                <input matInput placeholder="Digite o nome Completo aqui.">
            </mat-form-field>
        </mat-card-content>

        <mat-card-content>
            <mat-form-field class="full-width" appearance="outline">
                <mat-label>Digite o seu email</mat-label>
                <input matInput placeholder="Digite o seu email aqui.">
            </mat-form-field>
        </mat-card-content>

        <mat-card-content>
            <mat-form-field class="full-width" appearance="outline">
                <mat-label>Cadastre sua senha</mat-label>
                <input matInput placeholder="Digite a senha aqui." type="password">
            </mat-form-field>
        </mat-card-content>

        <mat-card-actions>
            <button matButton class="full-width"  matButton="elevated">Cadastrar</button>
        </mat-card-actions>
    </mat-card>
</div>
